version: "3.8"

services:
  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.5.0-community
    container_name: cpg-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_server_default__advertised__address: "cpg-neo4j"
      NEO4J_server_bolt_advertised__address: "cpg-neo4j:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j/init:/var/lib/neo4j/import

  # Kafka Connect Service built with Neo4j Connector Plugin
  kafka-connect:
    build:
      context: ./kafka-connect
      dockerfile: Dockerfile
    container_name: cpg-kafka-connect
    ports:
      - "8083:8083"
    depends_on:
      - kafka
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka:29092"
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: "cpg-connect-group"
      CONNECT_CONFIG_STORAGE_TOPIC: "cpg-connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "cpg-connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "cpg-connect-status"
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/filestream-connectors,/opt/kafka-connect-plugins,/usr/share/confluent-hub-components"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
    volumes:
      - ./kafka-connect/plugins:/opt/kafka-connect-plugins
      - ./kafka-connect/connectors:/opt/kafka-connectors

volumes:
  neo4j_data:
  neo4j_logs:
