version: "3.8"

services:
  # Apache Kafka Broker in KRaft mode (no Zookeeper required)
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: cpg-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REREPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LATEST_COMMITTED_OFFSET_TO_COMPARE: 'true'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      # TODO: Configure persistent volume storage path in final evaluation
      - kafka_data:/var/lib/kafka/data

  # Kafka Connect Service loaded with Neo4j Connector Plugin
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.3.0
    container_name: cpg-kafka-connect
    ports:
      - "8083:8083"
    depends_on:
      - kafka
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka:29092"
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: "cpg-connect-group"
      CONNECT_CONFIG_STORAGE_TOPIC: "cpg-connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "cpg-connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "cpg-connect-status"
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/filestream-connectors,/opt/kafka-connect-plugins"
    volumes:
      # Volume mapping to load Neo4j Sink Connector jar files
      - ./kafka-connect/plugins:/opt/kafka-connect-plugins
      - ./kafka-connect/connectors:/opt/kafka-connectors

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.5.0-community
    container_name: cpg-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # TODO: Load credentials securely from env, do not hardcode secrets
      - NEO4J_AUTH=neo4j/TODO_NEO4J_PASSWORD
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j/init:/var/lib/neo4j/import

  # MongoDB Document Database
  mongodb:
    image: mongo:6.0.4
    container_name: cpg-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      # TODO: Load password securely from env
      - MONGO_INITDB_ROOT_PASSWORD=TODO_MONGO_PASSWORD
    volumes:
      - mongodb_data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d

volumes:
  kafka_data:
  neo4j_data:
  neo4j_logs:
  mongodb_data:
